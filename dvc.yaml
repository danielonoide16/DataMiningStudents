stages:
  limpiar:
    cmd: python -m src.datos.limpiar
    deps:
      - data/raw/estudiantes_portugues.csv
      - src/datos/limpiar.py
      - src/utils.py
    params:
      - limpiar
    outs:
      - data/interim/estudiantes_limpio.csv
    metrics:
      - reports/metrics/limpieza.json:
          cache: false

  preparar:
    cmd: python -m src.caracteristicas.preparar
    deps:
      - data/interim/estudiantes_limpio.csv
      - src/caracteristicas/preparar.py
      - src/utils.py
    params:
      - general.semilla
      - preparar
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  # ---------- modelos de clasificacion (riesgo de reprobar) ----------
  logistica:
    cmd: python -m src.modelos.logistica
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/modelos/logistica.py
      - src/modelos/evaluacion.py
      - src/utils.py
    params:
      - logistica
    outs:
      - models/logistica.joblib
    metrics:
      - reports/metrics/logistica.json:
          cache: false
    plots:
      - reports/figures/logistica_coeficientes.png:
          cache: false
      - reports/figures/logistica_matriz_confusion.png:
          cache: false

  arbol:
    cmd: python -m src.modelos.arbol
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/modelos/arbol.py
      - src/modelos/evaluacion.py
      - src/utils.py
    params:
      - general.semilla
      - arbol
    outs:
      - models/arbol.joblib
      - reports/metrics/arbol_reglas.txt:
          cache: false
    metrics:
      - reports/metrics/arbol.json:
          cache: false
    plots:
      - reports/figures/arbol.png:
          cache: false
      - reports/figures/arbol_matriz_confusion.png:
          cache: false

  # ---------- perfiles y prediccion de la calificacion ----------
  kmeans:
    cmd: python -m src.modelos.kmeans
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/modelos/kmeans.py
      - src/utils.py
    params:
      - general.semilla
      - kmeans
    outs:
      - models/kmeans.joblib
      - reports/metrics/kmeans_perfiles.csv:
          cache: false
    metrics:
      - reports/metrics/kmeans.json:
          cache: false
    plots:
      - reports/figures/kmeans_elegir_k.png:
          cache: false
      - reports/figures/kmeans_perfiles_pca.png:
          cache: false

  lineal:
    cmd: python -m src.modelos.lineal
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/modelos/lineal.py
      - src/utils.py
    params:
      - lineal
    outs:
      - models/lineal.joblib
    metrics:
      - reports/metrics/lineal.json:
          cache: false
    plots:
      - reports/figures/lineal_real_vs_predicho.png:
          cache: false

  # ---------- modelo para la app ----------
  exportar:
    cmd: python -m src.modelos.exportar
    deps:
      - models/logistica.joblib
      - models/kmeans.joblib
      - data/processed/train.csv
      - src/modelos/exportar.py
      - src/utils.py
    outs:
      - app/modelo_app.joblib:
          cache: false
