stages:
  limpiar:
    cmd: python -m src.datos.limpiar
    deps:
      - data/raw/estudiantes_portugues.csv
      - src/datos/limpiar.py
      - src/utils.py
    params:
      - limpiar
    outs:
      - data/interim/estudiantes_limpio.csv
    metrics:
      - reports/metrics/limpieza.json:
          cache: false

  preparar:
    cmd: python -m src.caracteristicas.preparar
    deps:
      - data/interim/estudiantes_limpio.csv
      - src/caracteristicas/preparar.py
      - src/utils.py
    params:
      - general.semilla
      - preparar
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
